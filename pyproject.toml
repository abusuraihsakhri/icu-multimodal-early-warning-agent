[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "icu-multimodal-early-warning-engine"
version = "2.0.0"
description = "ICU-Multimodal Sentinel: Real-Time Waveform & Lab Fusion Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "httpx>=0.27",
]

[project.scripts]
icu-multimodal-early-warning-engine = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/icu-multimodal-early-warning-agent"
Repository = "https://github.com/abusuraihsakhri/icu-multimodal-early-warning-agent.git"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
py-modules = ["cli", "enrichment", "simulator", "icu_multimodal_app"]

[tool.setuptools.packages.find]
include = ["agents*", "icu_multimodal*"]
