version: '3.8'

services:
  icu-multimodal-early-warning-engine:
    build: .
    container_name: icu-multimodal-early-warning-engine
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=icu-multimodal-early-warning-engine-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
