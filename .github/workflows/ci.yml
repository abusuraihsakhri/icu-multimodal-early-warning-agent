name: Tests and security regression checks
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      AUDIT_SECRET_KEY: CI-only-insecure-test-key-do-not-use-with-real-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" build
          python -m pip check
      - name: Compile Python source
        run: python -m compileall -q agents icu_multimodal cli.py enrichment.py
      - name: Run Python tests
        run: python -m pytest -q
      - name: Validate package distribution
        run: python -m build
      - name: Validate browser JavaScript
        run: |
          node --check web/app.js
          node --test tests/web.test.cjs
      - name: Verify audit signatures in standalone process
        run: |
          python -c "from agents.base import AuditTrail; t=AuditTrail(); t.log('CI','test','check',{'ok':True}); assert t.verify_integrity(); t.logs[0]['actor']='altered'; assert not t.verify_integrity()"
